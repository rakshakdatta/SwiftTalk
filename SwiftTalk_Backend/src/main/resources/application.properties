# =============================
# DATABASE CONFIGURATION
# =============================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/swift_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER:swifttalk}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================
# JPA / HIBERNATE
# =============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================
# SERVER CONFIG
# =============================
server.address=0.0.0.0
server.port=8080

# =============================
# JWT
# =============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =============================
# TWILIO CONFIG (Phone OTP)
# =============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.verify.sid=${TWILIO_VERIFY_SID:}

# =============================
# CORS (Frontend access)
# =============================
spring.web.cors.allowed-origins=http://localhost:3002,http://127.0.0.1:3002,http://192.168.1.5:3002,http://172.21.224.1:3002

# =============================
# EMAIL CONFIG (Brevo SMTP)
# =============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${SMTP_FROM:}

# =============================
# FILE UPLOAD
# =============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =============================
# REDIS CONFIG
# =============================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=5000
